name: sentry_room_mobile
description: A professional security monitoring app for Sentry Room.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  printing: ^5.12.0
  flutter_local_notifications: ^17.0.0
  web_socket_channel: ^3.0.1
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
